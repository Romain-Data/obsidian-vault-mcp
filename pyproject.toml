[project]
name = "coffre-mcp"
version = "0.1.0"
description = "Serveur MCP distant qui donne à Claude un accès contrôlé (OAuth 2.1 + TOTP) à un coffre Obsidian stocké dans Nextcloud"
authors = [
    { name = "Romain-Data", email = "184205713+Romain-Data@users.noreply.github.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pyotp>=2.12.1",
    "qrcode>=8.2",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
